name: impactai
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.1
  firebase_storage: ^12.4.4  # Updated firebase_storage version
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^5.0.7
  url_launcher: ^6.0.9
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  fl_chart: ^0.64.0


  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  fluttertoast: ^8.2.8
  provider: ^6.1.2
  country_code_picker: ^3.1.0
  shared_preferences: ^2.3.2
  flutter_switch: ^0.3.2
  universal_platform: ^1.1.0
  figma_squircle: ^0.6.3
  intl: ^0.19.0
  google_maps_flutter: ^2.12.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/imagesNight/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Black.ttf
        - asset: fonts/Poppins-Bold.ttf
        - asset: fonts/Poppins-ExtraBold.ttf
        - asset: fonts/Poppins-ExtraLight.ttf
        - asset: fonts/Poppins-Light.ttf
        - asset: fonts/Poppins-SemiBold.ttf
        - asset: fonts/Poppins-Medium.ttf
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Thin.ttf

flutter_intl:
  enabled: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

dependency_overrides:
  intl: ^0.19.0
