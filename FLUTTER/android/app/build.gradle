plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def flutterVersionCode = 1
def flutterVersionName = "1.0"

android {
    android.buildFeatures.buildConfig true
    namespace 'com.hummer.impactai'
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.hummer.impactai"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Enable BuildConfig feature to resolve cloud_firestore issue
        buildConfigField "String", "FIREBASE_API_KEY", "\"YOUR_FIREBASE_API_KEY\""
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true  // Ensure this is enabled
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}


dependencies {
    implementation 'com.google.firebase:firebase-firestore:24.3.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}

apply plugin: 'com.google.gms.google-services'
